<!-- Futuristic User Header Component -->
<header class="futuristic-header user-header">
    <div class="header-container">
        <a href="/user/home" class="logo">
            <div class="logo-icon">
                <i class="bi bi-person-circle"></i>
            </div>
            <div class="logo-text">
                <span class="logo-main">SPPS</span>
                <span class="logo-sub">User Portal</span>
            </div>
        </a>

        <nav class="nav-btns">
            {% if session.get('user_id') %}
            <a href="/user/home" class="nav-btn">
                <i class="bi bi-house"></i>
                <span>Dashboard</span>
            </a>
            <a href="/predict" class="nav-btn">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Predict</span>
            </a>
            <a href="/linear-regression" class="nav-btn">
                <i class="bi bi-bar-chart-line"></i>
                <span>LR Predict</span>
            </a>

            <a href="/user/students" class="nav-btn">
                <i class="bi bi-people"></i>
                <span>Students</span>
            </a>
            <div class="dropdown">
                <button class="dropbtn">
                    <i class="bi bi-three-dots-vertical"></i>
                    <span>More</span>
                </button>
                <div class="dropdown-content">
                    <a href="/user/exams">
                        <i class="bi bi-journal-text"></i>
                        <span>Exams</span>
                    </a>
                    <a href="/user/attendance">
                        <i class="bi bi-calendar-check"></i>
                        <span>Attendance</span>
                    </a>
                    <a href="/user/assignment">
                        <i class="bi bi-file-earmark-check"></i>
                        <span>Assignment</span>
                    </a>
                    <a href="/user/history">
                        <i class="bi bi-clock-history"></i>
                        <span>History</span>
                    </a>
                    <a href="/user/mass-predict">
                        <i class="bi bi-collection"></i>
                        <span>Mass Predict</span>
                    </a>
                    <a href="/user/change-password">
                        <i class="bi bi-key"></i>
                        <span>Change Password</span>
                    </a>
                    <a href="/logout">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
            {% else %}
            <a href="/login" class="nav-btn btn-ghost">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Login</span>
            </a>
            <a href="/signup" class="nav-btn btn-primary">
                <i class="bi bi-person-plus"></i>
                <span>Sign Up</span>
            </a>
            {% endif %}
        </nav>
    </div>
</header>

<!-- Futuristic styles are now in the main CSS file -->
