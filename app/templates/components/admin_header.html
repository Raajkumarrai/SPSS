<!-- Futuristic Admin Header Component -->
<header class="futuristic-header admin-header">
    <div class="header-container">
        <a href="/admin/home" class="logo">
            <div class="logo-icon" style="background: linear-gradient(135deg, var(--accent), var(--accent-light));">
                <i class="bi bi-shield-check"></i>
            </div>
            <div class="logo-text">
                <span class="logo-main">SPPS</span>
                <span class="logo-sub">Admin Portal</span>
            </div>
        </a>
        
        <nav class="nav-btns">
            {% if session.get('user_id') and session.get('role') == 'admin' %}
                <a href="/admin/users" class="nav-btn">
                    <i class="bi bi-people"></i>
                    <span>Users</span>
                </a>
                <a href="/admin/students" class="nav-btn">
                    <i class="bi bi-mortarboard"></i>
                    <span>Students</span>
                </a>
                <a href="/admin/predict" class="nav-btn">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Predict</span>
                </a>
                <a href="/admin/activities" class="nav-btn">
                    <i class="bi bi-activity"></i>
                    <span>Activities</span>
                </a>
                <div class="dropdown">
                    <button class="dropbtn">
                        <i class="bi bi-three-dots-vertical"></i>
                        <span>More</span>
                    </button>
                    <div class="dropdown-content">
                        <a href="/admin/attendance">
                            <i class="bi bi-calendar-check"></i>
                            <span>Attendance</span>
                        </a>
                        <a href="/admin/assignment">
                            <i class="bi bi-journal-text"></i>
                            <span>Assignment</span>
                        </a>
                        <a href="/admin/history">
                            <i class="bi bi-clock-history"></i>
                            <span>History</span>
                        </a>
                        <a href="/admin/contact-messages">
                            <i class="bi bi-envelope"></i>
                            <span>Messages</span>
                        </a>
                        <a href="/admin/mass-predict">
                            <i class="bi bi-collection"></i>
                            <span>Mass Predict</span>
                        </a>
                        <a href="/admin/change-password">
                            <i class="bi bi-key"></i>
                            <span>Change Password</span>
                        </a>
                        <a href="/logout">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Logout</span>
                        </a>
                    </div>
                </div>
            {% else %}
                <a href="/admin" class="nav-btn btn-ghost">
                    <i class="bi bi-shield-lock"></i>
                    <span>Admin Login</span>
                </a>
            {% endif %}
        </nav>
    </div>
</header>

<!-- Futuristic styles are now in the main CSS file -->
